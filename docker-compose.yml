services:
  # MongoDB 数据库
  mongodb:
    image: mongo:7
    container_name: school-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: school
    volumes:
      - mongodb_data:/data/db
    # MongoDB 仅在内网可访问，不暴露公网端口
    # ports:
    #   - "27017:27017"
    networks:
      - school-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端 API 服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: school-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URL: mongodb://mongodb:27017/school
      # Dify AI 配置
      DIFY_BASE_URL: ${DIFY_BASE_URL:-https://api.dify.ai}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
      DIFY_TEACHER_LESSON_APP_ID: ${DIFY_TEACHER_LESSON_APP_ID:-}
      DIFY_TEACHER_EXAM_APP_ID: ${DIFY_TEACHER_EXAM_APP_ID:-}
      DIFY_TEACHER_ANALYTICS_APP_ID: ${DIFY_TEACHER_ANALYTICS_APP_ID:-}
      DIFY_STUDENT_LEARNING_APP_ID: ${DIFY_STUDENT_LEARNING_APP_ID:-}
      DIFY_STUDENT_PRACTICE_APP_ID: ${DIFY_STUDENT_PRACTICE_APP_ID:-}
      # 即梦AI 配置
      JIMENG_API_URL: ${JIMENG_API_URL:-https://visual.volcengineapi.com}
      VOLC_ACCESS_KEY: ${VOLC_ACCESS_KEY:-}
      VOLC_SECRET_KEY: ${VOLC_SECRET_KEY:-}
      JIMENG_IMAGE_ENABLED: ${JIMENG_IMAGE_ENABLED:-false}
      JIMENG_VIDEO_ENABLED: ${JIMENG_VIDEO_ENABLED:-false}
      # Ollama 配置
      OLLAMA_URL: ${OLLAMA_URL:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-r1}
      # CORS
      CORS_ORIGIN: http://118.178.111.88
    # 后端仅在内网可访问，不暴露公网端口
    # ports:
    #   - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/videos:/app/videos
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - school-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 前端 Web 服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: school-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - school-network

networks:
  school-network:
    driver: bridge

volumes:
  mongodb_data:
