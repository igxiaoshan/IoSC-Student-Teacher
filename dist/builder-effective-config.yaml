directories:
  output: dist
  buildResources: build-resources
appId: com.schoolmanagement.app
productName: 学校管理系统
files:
  - filter:
      - electron-main.js
      - preload.js
      - assets/**/*
      - backend/**/*
      - frontend/build/**/*
      - '!backend/node_modules/**/*'
      - '!backend/.env'
      - '!backend/test/**/*'
      - '!backend/scripts/**/*'
      - '!frontend/src/**/*'
      - '!frontend/public/**/*'
      - '!frontend/node_modules/**/*'
extraResources:
  - from: backend
    to: backend
    filter:
      - '**/*'
      - '!node_modules/**/*'
      - '!test/**/*'
      - '!scripts/**/*'
      - '!.env'
  - from: frontend/build
    to: frontend
win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32
    - target: portable
      arch:
        - x64
  icon: assets/icon.ico
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 学校管理系统
  include: installer.nsh
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/icon.icns
  category: public.app-category.education
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: assets/icon.png
  category: Education
dmg:
  title: 学校管理系统安装程序
  icon: assets/icon.icns
  background: assets/dmg-background.png
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      'y': 200
      type: file
    - x: 400
      'y': 200
      type: link
      path: /Applications
publish:
  provider: github
  owner: your-github-username
  repo: school-management-system
electronVersion: 28.3.3
