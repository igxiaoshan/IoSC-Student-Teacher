app:
  description: IoSC智能学习助手 - 自动识别学生/老师角色，优先知识库检索，未命中时由LLM生成
  icon: 🎓
  icon_background: '#E3F2FD'
  icon_type: emoji
  mode: advanced-chat
  name: IoSC学习助手
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
