        instruction: "根据用户的提问内容和语气，判断用户是学生还是老师。如果提问涉及解题、学习概念、复习、作业、考试准备等，判断为student；如果提问涉及教案设计、教学计划、课程安排、学生管理、教学评估等，判断为teacher。无法判断时默认为student。只返回student或teacher。"
