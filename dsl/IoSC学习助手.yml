            请根据以下知识库检索结果来回答学生的问题。如果检索结果中有相关信息，请基于检索结果回答；如果检索结果不够充分，请结合你的知识补充回答。


            回答要求：

            1. 准确、详细、易懂

            2. 如果是数学或编程题目，请提供步骤详解

            3. 引用相关知识点

            4. 如果问题超出知识范围，请诚实说明


