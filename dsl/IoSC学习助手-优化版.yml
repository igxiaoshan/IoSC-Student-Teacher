app:
  description: IoSC智能学习助手 - 自动识别学生/老师角色，优先知识库检索，未命中时由LLM生成，格式化输出
  icon: 🎓
  icon_background: '#E3F2FD'
  mode: advanced-chat
  name: IoSC学习助手-优化版
  use_icon_as_answer_icon: false
kind: app
version: 0.1.2
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      - .PDF
      - .DOC
      - .DOCX
      - .TXT
      allowed_file_types:
      - image
      - document
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: true
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: '你好！我是IoSC智能学习助手🎓


      我会根据你的角色（学生或老师）自动提供学习或教学相关的资料和解答。


      📚 **学生**可以问我：概念解释、题目求解、复习指导、作业帮助、考试准备等

      📚 **老师**可以问我：教案设计、教学计划、课程安排、学生管理、教学评估等


      请直接输入你的问题！'
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 帮我解释一下这个概念
    - 这道题怎么解？
    - 帮我设计一份教案
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
