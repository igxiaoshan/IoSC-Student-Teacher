            2. 经营范围

            - xx

            - xx

            3. 所属行业

            - 行业分类：

            - 产业链位置：

            - 行业地位：

            ***

            ### 二、企业司法风险

            1. 法律诉讼:  xx

            2. 小结：xxx

            ***

            ### 三、企业经营风险

            1. 经营异常:  xx

            2. 行政处罚:  xx

            3. 股权出质:  xx

            4. 动产抵押:  xx

            5. 小结：xxx

            ***

            ### 四、结论

            总结(提供综合分析评价)


